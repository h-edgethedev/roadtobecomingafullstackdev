<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blog post Card</title>
    <link rel="stylesheet" href="designing_a_blog_post_card.css">
</head>

<body>
    <div class="blog-post-card">

        <img src="https://cdn.freecodecamp.org/curriculum/labs/cover-photo.jpg" alt="workspace image" class="post-img">

        <div class="post-content">
            <h2 class="post-title">Learn Fullstack Web Development in 2026</h2>
            <p class="post-excerpt">Stay ahead of the curve with the latest trends in web development. Discover what's
                new
                and exciting in 2026
            </p>
            <a href="https://github.com/h-edgethedev" class="read-more" target="_blank">Read More</a>
        </div>

    </div>
</body>

</html>
