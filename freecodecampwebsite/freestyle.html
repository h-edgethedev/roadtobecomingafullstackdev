<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My first freestyle</title>
    <link rel="stylesheet" href="freestyle.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mogra&family=Playwrite+NZ+Guides&display=swap"
        rel="stylesheet">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+NZ+Basic:wght@100..400&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="menu">
        <main>
            <section>
                <h2>Camper Cafe</h2>
                <p class="established">Est. 2020
                    <hr>
                <h2>Coffee</h2>
                <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/coffee.jpg" alt="coffee icon">
                <article class="item">
    <p class="flavor">French Vanilla</p><p class="price">3.00</p></article>
                <article class="item">
    <p class="flavor">Caramel Macchiato</p><p class="price">3.75</p></article>
                <article class="item">
    <p class="flavor">Pumpkin Spice</p><p class="price">3.50</p></article>
                <article class="item">
    <p class="flavor">Hazelnut</p><p class="price">4.00</p></article>
                <article class="item">
    <p class="flavor">Mocha</p><p class="price">4.50</p></article>
            </section>
            <section>
                <h2>Desserts</h2>
                <img src="https://cdn.freecodecamp.org/curriculum/css-cafe/pie.jpg" alt="pie icon">
                <article class="item">
    <p class="dessert">Donut</p><p class="price">1.50</p></article>
                <article class="item">
    <p class="dessert">Cherry Pie</p><p class="price">2.75</p></article>
                <article class="item">
    <p class="dessert">Cheesecake</p><p class="price">3.00</p></article>
                <article class="item">
    <p class="dessert">Cinnamon Roll</p><p class="price">2.50</p></article>
            </section>
        </main>
        <hr>
        <footer>
            <address>
                <p><a href="https://www.freecodecamp.org">Visit our website</a></p>
<p class="address">123 Free Code Camp Drive</p></address>
        </footer>
    </div>
</body>

</html>
