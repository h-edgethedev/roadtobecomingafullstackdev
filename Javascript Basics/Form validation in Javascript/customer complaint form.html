<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="customer complaint form.css">
</head>
<body>
    <div class="card">
      <p class="eyebrow">H~€DG€ Studios</p>
      <h1 class="title">Mirror,&nbsp;mirror.</h1>
      <p class="subtitle">Type a word or phrase. We strip the noise and read it both ways.</p>

      <div class="field">
        <label for="text-input" class="field-label">Text to check</label>
        <div class="field-row">
          <input
            id="text-input"
            type="text"
            placeholder="e.g. never odd or even"
            autocomplete="off"
            spellcheck="false"
            value="Heritage is a boy"
          />
          <button id="check-btn" type="button">Check</button>
        </div>
      </div>

      <div id="result" class="result" aria-live="polite"></div>
    </div>

    <script src="customer complaint form.js"></script>
</body>
</html>
