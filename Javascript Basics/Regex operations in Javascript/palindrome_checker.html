<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Palindrome Checker — H~€DG€ Studios</title>
  <link rel="stylesheet" href="palindrome_checker.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <main class="stage">
    <div class="card">
      <p class="eyebrow">H~€DG€ Studios</p>
      <h1 class="title">Mirror,&nbsp;mirror.</h1>
      <p class="subtitle">Type a word or phrase. We strip the noise and read it both ways.</p>

      <div class="field">
        <label for="text-input" class="field-label">Text to check</label>
        <div class="field-row">
          <input
            id="text-input"
            type="text"
            placeholder="e.g. never odd or even"
            autocomplete="off"
            spellcheck="false"
            value="Heritage is a boy"
          />
          <button id="check-btn" type="button">Check</button>
        </div>
      </div>

      <div id="result" class="result" aria-live="polite"></div>
    </div>

    <p class="footnote">Ignoring case, spacing &amp; punctuation.</p>
  </main>

  <script src="palindrome_checker.js"></script>
</body>
</html>
