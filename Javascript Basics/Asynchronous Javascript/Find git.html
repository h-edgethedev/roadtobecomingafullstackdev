<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Find git</title>
    <link rel="stylesheet" href="Find git.css">
</head>

<body>
    <header>
        <h1>Find git</h1>
        <p>Find any git user and their details using only their usernames</p>
    </header>
    <main>
        <input type="text" placeholder="Input Github Username" required id="Username-input">
        <button id="search-btn"><img src="search_icon.png" alt="Search icon"></button>
        <div id="loader" class="loader hidden"></div>
        <div id="results-container"></div>
    </main>

    <script src="Find git.js"></script>
</body>

</html>
