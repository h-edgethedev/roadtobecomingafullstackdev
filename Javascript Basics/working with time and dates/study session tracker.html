<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Study Session Tracker</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & Tokens ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:          #080812;
      --surface:     #10102a;
      --card:        rgba(22, 14, 50, 0.72);
      --border:      rgba(124, 58, 237, 0.22);
      --border-hi:   rgba(167, 139, 250, 0.45);
      --purple:      #7c3aed;
      --purple-lo:   #5b21b6;
      --glow:        #a78bfa;
      --glow-dim:    rgba(167, 139, 250, 0.08);
      --text:        #e2d9f3;
      --text-muted:  #7c6faa;
      --text-dim:    #4a4070;
      --green:       #34d399;
      --red:         #f87171;
      --radius:      16px;
      --radius-sm:   10px;
    }

    /* ── Base ───────────────────────────────────────────────────── */
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      line-height: 1.5;
    }

    body {
      /* subtle radial glow from top-left */
      background-image:
        radial-gradient(ellipse 60% 50% at 15% -5%, rgba(92, 33, 182, 0.35) 0%, transparent 70%),
        radial-gradient(ellipse 40% 30% at 85% 100%, rgba(124, 58, 237, 0.18) 0%, transparent 60%);
      min-height: 100vh;
      padding: 40px 20px 80px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* ── Layout wrapper ─────────────────────────────────────────── */
    .app {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Glass card ─────────────────────────────────────────────── */
    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      padding: 28px;
      transition: border-color 0.3s;
    }

    .card:hover {
      border-color: var(--border-hi);
    }

    /* ── Header ─────────────────────────────────────────────────── */
    .header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      padding: 0 4px;
    }

    .header-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--glow);
      opacity: 0.7;
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text);
    }

    .live-clock {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2px;
    }

    /* id="liveClock" — JS: update every second with current time */
    #liveClock {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 600;
      color: var(--glow);
      letter-spacing: 0.02em;
      line-height: 1;
    }

    /* id="liveDate" — JS: set once on load with today's date */
    #liveDate {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-muted);
      letter-spacing: 0.08em;
    }

    /* ── Status dot + ring ──────────────────────────────────────── */
    /*
      The signature element: a pulse ring that activates when a session is running.
      JS: add class "active" to #statusIndicator when session starts,
          remove it when session ends.
    */
    .status-row {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    #statusIndicator {
      position: relative;
      width: 12px;
      height: 12px;
      flex-shrink: 0;
    }

    #statusIndicator .dot {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: var(--text-dim);
      transition: background 0.3s;
    }

    #statusIndicator .ring {
      position: absolute;
      inset: -5px;
      border-radius: 50%;
      border: 2px solid var(--glow);
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.3s, transform 0.3s;
    }

    #statusIndicator.active .dot {
      background: var(--green);
    }

    #statusIndicator.active .ring {
      opacity: 1;
      transform: scale(1);
      animation: pulse-ring 1.8s ease-out infinite;
    }

    @keyframes pulse-ring {
      0%   { transform: scale(1);    opacity: 0.9; }
      70%  { transform: scale(2.4);  opacity: 0;   }
      100% { transform: scale(2.4);  opacity: 0;   }
    }

    /* id="statusLabel" — JS: "No active session" / "Session in progress" */
    #statusLabel {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-muted);
      transition: color 0.3s;
    }

    #statusIndicator.active ~ #statusLabel {
      color: var(--green);
    }

    /* ── Time display grid ──────────────────────────────────────── */
    .time-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .time-cell {
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
    }

    .time-cell-label {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    /* id="startTime" — JS: set to start time string e.g. "8:15 PM" */
    /* id="endTime"   — JS: set to end time string e.g. "10:05 PM" */
    #startTime,
    #endTime {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: 0.01em;
      min-height: 27px; /* prevents layout shift */
      transition: color 0.3s;
    }

    #startTime.set { color: var(--glow); }
    #endTime.set   { color: var(--glow); }

    /* ── Duration banner ────────────────────────────────────────── */
    /*
      id="durationBanner"
      JS: add class "visible" to show it (it starts hidden),
          set text of #durationValue e.g. "1h 50m"
    */
    #durationBanner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, rgba(124, 58, 237, 0.18), rgba(167, 139, 250, 0.08));
      border: 1px solid rgba(124, 58, 237, 0.35);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(6px);
      transition: opacity 0.4s, transform 0.4s;
      pointer-events: none;
    }

    #durationBanner.visible {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }

    .duration-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    #durationValue {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 700;
      color: var(--glow);
      letter-spacing: 0.02em;
    }

    /* ── Buttons ────────────────────────────────────────────────── */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 20px;
      border-radius: var(--radius-sm);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
      border: none;
      transition: opacity 0.2s, transform 0.15s, box-shadow 0.2s;
      user-select: none;
    }

    .btn:active { transform: scale(0.97); }

    /* id="startBtn" */
    #startBtn {
      background: linear-gradient(135deg, var(--purple), var(--purple-lo));
      color: #fff;
      box-shadow: 0 4px 20px rgba(124, 58, 237, 0.4);
    }

    #startBtn:hover {
      box-shadow: 0 4px 30px rgba(124, 58, 237, 0.6);
    }

    #startBtn:disabled {
      opacity: 0.35;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* id="endBtn" */
    #endBtn {
      background: rgba(248, 113, 113, 0.12);
      color: var(--red);
      border: 1px solid rgba(248, 113, 113, 0.3);
    }

    #endBtn:hover:not(:disabled) {
      background: rgba(248, 113, 113, 0.2);
      border-color: rgba(248, 113, 113, 0.55);
    }

    #endBtn:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .btn-icon {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    /* ── History card ───────────────────────────────────────────── */
    .history-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }

    .history-title {
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* id="sessionCount" — JS: set to e.g. "3 sessions" */
    #sessionCount {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--text-dim);
      background: rgba(124, 58, 237, 0.12);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 2px 10px;
    }

    /* id="historyList" — JS: inject .session-entry elements here */
    #historyList {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 
      JS: for each saved session, create and append this structure:
      <div class="session-entry">
        <div class="session-date">24/06/2026</div>
        <div class="session-times">8:15 PM – 10:05 PM</div>
        <div class="session-duration">1h 50m</div>
      </div>
    */
    .session-entry {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.25);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      transition: border-color 0.2s, background 0.2s;
      animation: slide-in 0.3s ease-out;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateY(-8px); }
      to   { opacity: 1; transform: translateY(0);    }
    }

    .session-entry:hover {
      background: rgba(124, 58, 237, 0.07);
      border-color: var(--border-hi);
    }

    .session-left {
      display: flex;
      flex-direction: column;
      gap: 3px;
      min-width: 0;
    }

    .session-date {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: var(--text-dim);
      text-transform: uppercase;
    }

    .session-times {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      white-space: nowrap;
    }

    .session-duration {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--glow);
      background: rgba(167, 139, 250, 0.1);
      border: 1px solid rgba(167, 139, 250, 0.2);
      border-radius: 6px;
      padding: 4px 10px;
      white-space: nowrap;
      flex-shrink: 0;
    }

    /* ── Empty state ─────────────────────────────────────────────── */
    /* 
      id="emptyState"
      JS: hide this once historyList has entries
    */
    #emptyState {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding: 32px 0;
      color: var(--text-dim);
    }

    .empty-icon {
      font-size: 28px;
      opacity: 0.4;
    }

    .empty-text {
      font-size: 13px;
      font-weight: 500;
    }

    .empty-sub {
      font-size: 11px;
      color: var(--text-dim);
      opacity: 0.6;
    }

    /* ── Scrollable history ─────────────────────────────────────── */
    .history-scroll {
      max-height: 340px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }

    .history-scroll::-webkit-scrollbar { width: 4px; }
    .history-scroll::-webkit-scrollbar-track { background: transparent; }
    .history-scroll::-webkit-scrollbar-thumb {
      background: var(--border-hi);
      border-radius: 4px;
    }

    /* ── Footer ─────────────────────────────────────────────────── */
    .footer {
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 0.1em;
      padding: 0 4px;
    }

    /* ── Responsive ─────────────────────────────────────────────── */
    @media (max-width: 400px) {
      body { padding: 24px 14px 60px; }
      .card { padding: 20px; }
      h1 { font-size: 19px; }
      #liveClock { font-size: 17px; }
      .time-grid { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      #statusIndicator.active .ring { animation: none; opacity: 0.6; }
      .session-entry { animation: none; }
    }
  </style>
</head>

<body>
  <div class="app">

    <!-- ── Header ── -->
    <header class="header">
      <div class="header-title">
        <span class="eyebrow">H~€DG€ Studios</span>
        <h1>Study Tracker</h1>
      </div>

      <div class="live-clock">
        <!-- JS: update #liveClock every second — new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'}) -->
        <span id="liveClock">--:--:--</span>
        <!-- JS: set #liveDate once on load — new Date().toLocaleDateString('en-GB') -->
        <span id="liveDate">--/--/----</span>
      </div>
    </header>

    <!-- ── Session control card ── -->
    <div class="card">

      <!-- Status row -->
      <div class="status-row">
        <!--
          JS: add class "active" to #statusIndicator when session starts.
          Remove it when session ends.
        -->
        <div id="statusIndicator">
          <div class="dot"></div>
          <div class="ring"></div>
        </div>
        <!-- JS: set textContent to "Session in progress" / "No active session" -->
        <span id="statusLabel">No active session</span>
      </div>

      <!-- Time display -->
      <div class="time-grid">
        <div class="time-cell">
          <div class="time-cell-label">Start Time</div>
          <!-- JS: set textContent to e.g. "8:15 PM", add class "set" -->
          <div id="startTime">—</div>
        </div>
        <div class="time-cell">
          <div class="time-cell-label">End Time</div>
          <!-- JS: set textContent to e.g. "10:05 PM", add class "set" -->
          <div id="endTime">—</div>
        </div>
      </div>

      <!--
        Duration banner
        JS: add class "visible" after session ends.
        Set #durationValue text to e.g. "1h 50m"
      -->
      <div id="durationBanner">
        <span class="duration-label">Duration</span>
        <span id="durationValue">—</span>
      </div>

      <!-- Buttons -->
      <div class="btn-row">
        <!--
          #startBtn: disabled when a session is active
          JS: on click → record new Date(), update UI, enable endBtn, disable startBtn
        -->
        <button id="startBtn" class="btn">
          <!-- play icon -->
          <svg class="btn-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.5 2.5L13.5 8L3.5 13.5V2.5Z" fill="currentColor"/>
          </svg>
          Start Session
        </button>

        <!--
          #endBtn: disabled when no session is active (starts disabled)
          JS: on click → record new Date(), calculate duration, save to history, update UI
        -->
        <button id="endBtn" class="btn" disabled>
          <!-- stop icon -->
          <svg class="btn-icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="3" y="3" width="10" height="10" rx="1.5" fill="currentColor"/>
          </svg>
          End Session
        </button>
      </div>
    </div>

    <!-- ── History card ── -->
    <div class="card">
      <div class="history-header">
        <span class="history-title">Study History</span>
        <!-- JS: update to e.g. "3 sessions" every time a session is saved -->
        <span id="sessionCount">0 sessions</span>
      </div>

      <!--
        #historyList: JS prepends a .session-entry div for each completed session.
        Structure to inject:
          <div class="session-entry">
            <div class="session-left">
              <div   class="session-date">24/06/2026</div>
              <div class="session-times">8:15 PM – 10:05 PM</div>
            </div>
            <div class="session-duration">1h 50m</div>
          </div>

        Hide #emptyState when the first entry is added.
      -->
      <div class="history-scroll">
        <div id="historyList"></div>

        <!-- JS: set style.display = "none" once first entry added -->
        <div id="emptyState">
          <span class="empty-icon">📋</span>
          <span class="empty-text">No sessions yet</span>
          <span class="empty-sub">Start a session to begin tracking</span>
        </div>
      </div>
    </div>

    <footer class="footer">H~€DG€ STUDIOS &nbsp;·&nbsp; STUDY SESSION TRACKER</footer>
  </div>

  <!-- ═══════════════════════════════════════════════════════════
       YOUR JAVASCRIPT GOES HERE
       
       Key IDs to hook into:
       ┌──────────────────┬──────────────────────────────────────┐
       │ #startBtn        │ button — click to start              │
       │ #endBtn          │ button — click to end (starts disabled)│
       │ #statusIndicator │ div — add class "active" when running │
       │ #statusLabel     │ span — set text "Session in progress" │
       │ #startTime       │ div — set time text + add class "set" │
       │ #endTime         │ div — set time text + add class "set" │
       │ #durationBanner  │ div — add class "visible" when done  │
       │ #durationValue   │ span — set "1h 50m"                  │
       │ #historyList     │ div — prepend .session-entry divs    │
       │ #emptyState      │ div — hide on first entry            │
       │ #sessionCount    │ span — update "N sessions"           │
       │ #liveClock       │ span — update every second           │
       │ #liveDate        │ span — set on load                   │
       └──────────────────┴──────────────────────────────────────┘
  ════════════════════════════════════════════════════════════ -->
<script src="study session tracker.js"></script>

</body>
</html>
