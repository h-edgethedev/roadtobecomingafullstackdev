<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Todo list</title>
    <link rel="stylesheet" href="Practicing Building a TODO app.css">
</head>

<body>
    <main>
        <h1>My Todo App</h1>`
        <div class="todo-app">
            <button id="open-task-form-btn" class="btn large-btn">Add New Task</button>
            <form class="task-form hidden" id="task-form">
                <div class="task-form-header">
                    <button id="close-task-form-btn" class="close-task-form-btn">
                        <svg class="close-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48px"
                            height="48px">
                            <path fill="#F44336" d="M21.5 4.5H26.501V43.5H21.5z" transform="rotate(45.001 24 24)" />
                            <path fill="#F44336" d="M21.5 4.5H26.5V43.501H21.5z" transform="rotate(135.008 24 24)" />
                        </svg>
                    </button>
                </div>
                <div class="task-form-body">
                    <label for="title-input" class="task-form-label">Title</label>
                    <input type="text" id="title-input" class="form-control" value="">
                    <label for="date-input" class="task-form-label">Date</label>
                    <input type="date" class="form-control" id="date-input" value="">
                    <label for="description-input" class="task-form-label">Description</label>
                    <textarea class="form-control" cols="30" rows="5" id="description-input"></textarea>
                </div>  
                <div class="task-form-footer">
                    <button id="add-or-update-task-btn" class="btn large-btn" type="submit">Add Task</button>
                </div>
            </form>

            <dialog id="confirm-close-dialog">
                <form method="dialog">
                    <p class="discard-message-text">Discard Unsaved changes?</p>
                    <div class="confirm-close-dialog-btn-container">
                        <button id="cancel-btn" class="btn">Cancel</button>
                        <button id="discard-btn" class="btn">Discard</button>
                    </div>
                </form>
            </dialog>
            <div id="tasks-container"></div>
        </div>
    </main>

    <script src="Practicing Building a TODO app.js"></script>
</body>

</html>
