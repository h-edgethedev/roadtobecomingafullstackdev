<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="studypathstyles.css">
</head>

<body>
    <main>
        <section>
        <img src="/Images/studypathailogo.png" alt="Study Path AI logo" height="40px">
        <h2>Welcome to <span>StudyPath AI</span></h2>
        <h3 class="fillin">Kindly fill in your details below to create an account</h3>

        <div class="form">
            <form action="">
                <label for="emailaddress">Email Address</label>
                <input type="email" name="emailaddress" id="emailaddress" class="inputs"
                    placeholder="Johndoe@gmail.com">
                <label for="password">Password</label>
                <input type="password" name="password" id="password" class="inputs" placeholder="$mUndget2837">
                <label for="confirmpassword">Confirm Password</label>
                <input type="confirmpassword" name="confirmpassword" id="confirmpassword" class="inputs"
                    placeholder="$mUndget2837">
                <button>Continue</button>
            </form>
            <div class="login">
                <h4>Already have an account?</h4>
                <a href="#">Login</a>
            </div>

            <div class="divider">
                <hr>
                <span>Or</span>
                <hr>
            </div>
            <button id="cwg">Continue with Google</button>
        </div>
        </section>
    </main>

</body>

</html>
