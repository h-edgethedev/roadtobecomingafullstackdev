<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Littletacoshopstylesheet.css">
    <title>LTS Contact page</title>
</head>

<body>
    <header>
        <h2>Contact Us</h2>
        <ul>
            <li><a href="LittleTacoShopFreeCodeCampProject.html">Home</a></li>
            <li><a href="LittleTacoShopFreeCodeCampProject.html#about">About Us</a></li>
            <li><a href="LittleTacoShopFreeCodeCampProject.html#menu">Our Menu</a></li>
            <li><a href="storehours.html#">Store Hours</a></li>
        </ul>
        <figcaption>
            <img src="Images/tacos_close_up_400x260.png" alt="Little taco Shop tacos" height="200px" width="250px"><br>
            <caption>Little Taco shop Tacos</caption>
        </figcaption>
    </header>

    <section id="contactform">
        <h2>Our Contact Form</h2>
        <fieldset>
            <legend>Send Us A Message</legend>

            <p>
            <form action="https:httpbin.org/get" method="get">
                <label for="name">Name: </label>
                <input type="text" name="name" id="name" required placeholder="your name" autocomplete="on">
                </p>

                <p>
                <form action="https:httpbin.org/get" method="get">
                    <label for="email">email: </label>
                    <input type="email" email="email" id="email" required placeholder="your name" autocomplete="on">
                    </p>
                </form>

        </fieldset>
    </section>
</body>

</html>
