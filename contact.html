<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="Littletacoshopstylesheet.css">
    <title>LTS Contact page</title>
</head>

<body>
    <header>
        <h2>Contact Us</h2>
        <ul>
            <li><a href="LittleTacoShopFreeCodeCampProject.html">Home</a></li>
            <li><a href="LittleTacoShopFreeCodeCampProject.html#about">About Us</a></li>
            <li><a href="LittleTacoShopFreeCodeCampProject.html#menu">Our Menu</a></li>
            <li><a href="storehours.html#">Store Hours</a></li>
        </ul>
        <figcaption>
            <img src="Images/tacos_close_up_400x260.png" alt="Little taco Shop tacos" height="200px" width="250px"><br>
            <caption>Little Taco shop Tacos</caption>
        </figcaption>
    </header>

    <section id="contactform">
        <h2>Our Contact Form</h2>
        <fieldset>
            <legend>Send Us A Message</legend>

            <p>
            <form action="https:httpbin.org/get" method="get">
                <label for="name">Name: </label>
                <input type="text" name="name" id="name" required placeholder="your name" autocomplete="on">
                </p>

                <p>
                    <label for="email">Email: </label>
                    <input type="email" name="email" id="email" required placeholder="your name" autocomplete="on">
                </p>

                <p>
                    <label for="message">Your Message: </label><br>
                    <textarea name="message" id="message" placeholder="Type your message here" rows="8"
                        cols="25"></textarea>
                </p>
        </fieldset>
        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        </form>
    </section>
    <footer>
        <h2>Our Location</h2>
        <address>
            555 Taco Temptation Lane, Suite T<br>
            Kansas City, MO 55555-5555
            Phone: <a href="tel: +234 293 209 0293">+234 293 209 0293</a>
        </address>
        <a href="#">Back to Top</a>
        <hr>
        <p>Copyright &copy Little Taco Shop</p>

    </footer>
</body>

</html>
